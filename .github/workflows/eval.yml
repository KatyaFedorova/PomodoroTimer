name: Eval daily summary

# Runs only when the summary prompt, model or eval changes, to save free-tier quota.
on:
  pull_request:
    paths:
      - "functions/**"
      - "evals/daily-summary/**"
      - "composeApp/src/commonMain/kotlin/org/timer/main/domain/summary/**"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  eval:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    # Secrets aren't available to pull requests from forks; skip instead of failing.
    if: github.event_name == 'workflow_dispatch' || github.event.pull_request.head.repo.full_name == github.repository
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install deepEval
        run: pip install deepeval litellm

      - name: Run eval
        working-directory: evals/daily-summary
        env:
          GOOGLE_API_KEY: ${{ secrets.GOOGLE_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
        run: python run_eval.py

      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: eval-results
          path: evals/daily-summary/results/
