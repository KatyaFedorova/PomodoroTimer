name: Deploy to Firebase Hosting on development (dev)

on:
  push:
    branches:
      - develop

jobs:
  build_and_deploy_dev:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Use dev Firebase config
        run: cp composeApp/src/wasmJsMain/resources/firebaseConfig.dev.js composeApp/src/wasmJsMain/resources/firebaseConfig.js

      - name: Run unit tests
        run: ./gradlew :composeApp:testDebugUnitTest

      - name: Build app
        run: ./gradlew wasmJsBrowserDistribution

      - name: Copy assetlinks.json (Android)
        run: |
          mkdir -p composeApp/build/dist/wasmJs/productionExecutable/.well-known
          cp composeApp/src/wasmJsMain/resources/assetlinks.dev.json composeApp/build/dist/wasmJs/productionExecutable/.well-known/assetlinks.json

      - name: Copy apple-app-site-association (iOS)
        run: |
          mkdir -p composeApp/build/dist/wasmJs/productionExecutable/.well-known
          cp composeApp/src/wasmJsMain/resources/apple-app-site-association.dev composeApp/build/dist/wasmJs/productionExecutable/.well-known/apple-app-site-association
          cp composeApp/src/wasmJsMain/resources/apple-app-site-association.dev composeApp/build/dist/wasmJs/productionExecutable/apple-app-site-association

      - name: Deploy to Firebase Hosting (dev)
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_TOMATOPAWS_DEV }}
          channelId: live
          projectId: tomatopawsdev
