name: Deploy to Firebase Hosting on PR
on: pull_request
permissions:
  checks: write
  contents: read
  pull-requests: write

jobs:
  build_and_preview:
    if: ${{ github.event.pull_request.head.repo.full_name == github.repository }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Select Firebase config
        run: |
          if [ "${{ github.base_ref }}" = "main" ]; then
            cp composeApp/src/wasmJsMain/resources/firebaseConfig.prod.js composeApp/src/wasmJsMain/resources/firebaseConfig.js
          else
            cp composeApp/src/wasmJsMain/resources/firebaseConfig.dev.js composeApp/src/wasmJsMain/resources/firebaseConfig.js
          fi

      - name: Run unit tests
        run: ./gradlew :composeApp:testDebugUnitTest

      - name: Build app
        run: ./gradlew wasmJsBrowserDistribution

      - name: Copy assetlinks.json (Android)
        run: |
          mkdir -p composeApp/build/dist/wasmJs/productionExecutable/.well-known
          if [ "${{ github.base_ref }}" = "main" ]; then
            cp composeApp/src/wasmJsMain/resources/assetlinks.prod.json composeApp/build/dist/wasmJs/productionExecutable/.well-known/assetlinks.json
          else
            cp composeApp/src/wasmJsMain/resources/assetlinks.dev.json composeApp/build/dist/wasmJs/productionExecutable/.well-known/assetlinks.json
          fi

      - name: Copy apple-app-site-association (iOS)
        run: |
          mkdir -p composeApp/build/dist/wasmJs/productionExecutable/.well-known
          if [ "${{ github.base_ref }}" = "main" ]; then
            cp composeApp/src/wasmJsMain/resources/apple-app-site-association.prod composeApp/build/dist/wasmJs/productionExecutable/.well-known/apple-app-site-association
            cp composeApp/src/wasmJsMain/resources/apple-app-site-association.prod composeApp/build/dist/wasmJs/productionExecutable/apple-app-site-association
          else
            cp composeApp/src/wasmJsMain/resources/apple-app-site-association.dev composeApp/build/dist/wasmJs/productionExecutable/.well-known/apple-app-site-association
            cp composeApp/src/wasmJsMain/resources/apple-app-site-association.dev composeApp/build/dist/wasmJs/productionExecutable/apple-app-site-association
          fi

      - name: Deploy to Firebase Hosting (preview)
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ github.base_ref == 'main' && secrets.FIREBASE_SERVICE_ACCOUNT_KITTIDORO_TIMER || secrets.FIREBASE_SERVICE_ACCOUNT_TOMATOPAWS_DEV }}
          projectId: ${{ github.base_ref == 'main' && 'kittidoro-timer' || 'tomatopawsdev' }}
