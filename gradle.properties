#Kotlin
kotlin.code.style=official
kotlin.daemon.jvmargs=-Xmx8192M

#Gradle
org.gradle.jvmargs=-Xmx8192M -Dfile.encoding=UTF-8

#Android
android.nonTransitiveRClass=true
android.useAndroidX=true
android.suppressUnsupportedCompileSdk=35

# Release signing credentials are intentionally NOT stored here.
# Put them in ~/.gradle/gradle.properties (outside the repo), env vars, or -P flags:
#   RELEASE_STORE_FILE   (path to the keystore, e.g. /absolute/path/to/keystore)
#   RELEASE_STORE_PASSWORD
#   RELEASE_KEY_ALIAS
#   RELEASE_KEY_PASSWORD